name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            python-version: "3.9"
            deps: "pytest"
            # No VCF dependencies: the VCF tests are skipped, and the rest check that
            # degeneracy annotation works without them
          - name: full
            python-version: "3.10"
            deps: "pytest pysam networkx scipy"
          - name: full
            python-version: "3.12"
            deps: "pytest pysam networkx scipy"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install ${{ matrix.deps }}

      - name: Run tests
        run: python -m pytest
